name: Build bgfx libs for Solar2D

on:
  push:
    branches: [solar2d]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-all-platforms:
    runs-on: macos-15
    steps:
      - name: Checkout bgfx
        uses: actions/checkout@v4
        with:
          path: bgfx

      - name: Checkout bx
        uses: actions/checkout@v4
        with:
          repository: labolado/bx
          ref: solar2d
          path: bx

      - name: Checkout bimg
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bimg
          path: bimg

      - name: Compute release tag
        id: tag
        run: |
          BGFX_SHA=$(cd bgfx && git rev-parse --short=8 HEAD)
          BX_SHA=$(cd bx && git rev-parse --short=8 HEAD)
          BIMG_SHA=$(cd bimg && git rev-parse --short=8 HEAD)
          TAG="solar2d-${BGFX_SHA}-${BX_SHA}-${BIMG_SHA}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Computed tag: $TAG"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo labolado/bgfx &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG already exists, skipping build"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $TAG not found, will build"
          fi

      - name: Generate bgfx projects
        if: steps.check.outputs.exists == 'false'
        working-directory: bgfx
        run: |
          make .build/projects/gmake-osx-arm64
          make .build/projects/gmake-osx-x64
          make .build/projects/gmake-ios-arm64
          make .build/projects/gmake-ios-simulator
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          make .build/projects/gmake-android-arm64

      - name: Build bgfx macOS arm64 (Debug + Release)
        if: steps.check.outputs.exists == 'false'
        working-directory: bgfx
        run: |
          make -C .build/projects/gmake-osx-arm64 config=debug   bgfx bx bimg bimg_decode shaderc -j$(sysctl -n hw.ncpu)
          make -C .build/projects/gmake-osx-arm64 config=release  bgfx bx bimg bimg_decode shaderc -j$(sysctl -n hw.ncpu)

      - name: Build bgfx macOS x64 (Debug + Release)
        if: steps.check.outputs.exists == 'false'
        working-directory: bgfx
        run: |
          MACOSX_DEPLOYMENT_TARGET=10.15 make -C .build/projects/gmake-osx-x64 config=debug   bgfx bx bimg bimg_decode -j$(sysctl -n hw.ncpu)
          MACOSX_DEPLOYMENT_TARGET=10.15 make -C .build/projects/gmake-osx-x64 config=release  bgfx bx bimg bimg_decode -j$(sysctl -n hw.ncpu)

      - name: Build bgfx iOS device (Debug + Release)
        if: steps.check.outputs.exists == 'false'
        working-directory: bgfx
        run: |
          make -C .build/projects/gmake-ios-arm64 config=debug   bgfx bx bimg bimg_decode -j$(sysctl -n hw.ncpu)
          make -C .build/projects/gmake-ios-arm64 config=release  bgfx bx bimg bimg_decode -j$(sysctl -n hw.ncpu)

      - name: Build bgfx iOS simulator (fat arm64 + x86_64)
        if: steps.check.outputs.exists == 'false'
        working-directory: bgfx
        run: |
          make -C .build/projects/gmake-ios-simulator config=release bgfx bx bimg bimg_decode -j$(sysctl -n hw.ncpu)
          cp -r .build/projects/gmake-ios-simulator .build/projects/gmake-ios-simulator-x86
          find .build/projects/gmake-ios-simulator-x86 -name "*.make" -exec \
            sed -i '' \
              -e 's/-arch arm64/-arch x86_64/g' \
              -e 's|../../ios-simulator/|../../ios-simulator-x86/|g' \
            {} \;
          make -C .build/projects/gmake-ios-simulator-x86 config=release bgfx bx bimg bimg_decode -j$(sysctl -n hw.ncpu) \
            || echo "x86_64 simulator build failed, continuing with arm64 only"
          if [ -d .build/ios-simulator-x86/bin ]; then
            for arm_lib in .build/ios-simulator/bin/lib*.a; do
              name=$(basename "$arm_lib")
              x86_lib=".build/ios-simulator-x86/bin/$name"
              if [ -f "$x86_lib" ]; then
                lipo -create "$arm_lib" "$x86_lib" -output "$arm_lib"
                echo "Created fat binary: $name"
              fi
            done
          fi

      - name: Create universal macOS libs (arm64 + x64)
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p bgfx/.build/projects/xcode15
          for arm_lib in bgfx/.build/osx-arm64/bin/lib*.a; do
            name=$(basename "$arm_lib")
            x64_lib="bgfx/.build/osx-x64/bin/$name"
            if [ -f "$x64_lib" ]; then
              lipo -create "$arm_lib" "$x64_lib" -output "bgfx/.build/projects/xcode15/$name"
            else
              cp "$arm_lib" "bgfx/.build/projects/xcode15/$name"
            fi
          done
          lipo -info bgfx/.build/projects/xcode15/libbgfxRelease.a
          # Strip DWARF debug info from Debug libs to reduce archive size (~967MB → ~50MB)
          # Keeps symbol table (strip -S), removes debug sections only
          for lib in bgfx/.build/projects/xcode15/*.a; do
            strip -S "$lib"
          done
          echo "Stripped .a sizes:"
          ls -lh bgfx/.build/projects/xcode15/

      - name: Build bgfx Android arm64 (Release)
        if: steps.check.outputs.exists == 'false'
        working-directory: bgfx
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          make -C .build/projects/gmake-android-arm64 config=release bgfx bx bimg bimg_decode -j$(sysctl -n hw.ncpu)

      - name: Package release assets
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p release-assets
          tar -czf release-assets/bgfx-macos.tar.gz        -C bgfx/.build/projects/xcode15 .
          tar -czf release-assets/bgfx-ios-device.tar.gz   -C bgfx/.build/ios-arm64/bin .
          tar -czf release-assets/bgfx-ios-simulator.tar.gz -C bgfx/.build/ios-simulator/bin .
          tar -czf release-assets/bgfx-android.tar.gz      -C bgfx/.build/android-arm64/bin .
          mkdir -p release-assets/tools-tmp
          cp bgfx/.build/osx-arm64/bin/shadercRelease release-assets/tools-tmp/shaderc
          chmod +x release-assets/tools-tmp/shaderc
          tar -czf release-assets/bgfx-tools.tar.gz -C release-assets/tools-tmp .
          ls -lh release-assets/

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release create "$TAG" \
            --repo labolado/bgfx \
            --title "$TAG" \
            --notes "Prebuilt bgfx static libraries for Solar2D (labolado/corona). Auto-generated by build-libs.yml." \
            release-assets/bgfx-macos.tar.gz \
            release-assets/bgfx-ios-device.tar.gz \
            release-assets/bgfx-ios-simulator.tar.gz \
            release-assets/bgfx-android.tar.gz \
            release-assets/bgfx-tools.tar.gz
          echo "Created release: $TAG"

